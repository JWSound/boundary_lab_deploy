name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest tests
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm run test:viewport
        working-directory: desktop
      - run: npm run test:placement
        working-directory: desktop
      - run: npm run test:filters
        working-directory: desktop
      - run: npm run test:pattern
        working-directory: desktop
      - run: npm run test:runtime
        working-directory: desktop
      - run: npm run test:viewport-rendering
        working-directory: desktop
      - run: npm run test:editing
        working-directory: desktop
      - run: npm run test:editing-ui
        working-directory: desktop
      - run: npm run test:projects
        working-directory: desktop
