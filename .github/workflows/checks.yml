name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest tests
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm run test:viewport
        working-directory: desktop
      - run: npm run test:placement
        working-directory: desktop
      - run: npm run test:filters
        working-directory: desktop
      - run: npm run test:pattern
        working-directory: desktop
      - run: npm run test:runtime
        working-directory: desktop
      - run: npm run test:viewport-rendering
        working-directory: desktop
      - run: npm run test:editing
        working-directory: desktop
      - run: npm run test:editing-ui
        working-directory: desktop
      - run: npm run test:projects
        working-directory: desktop
  # Keep the protected branch's existing required check name while requiring
  # both platform jobs to succeed, including failures/cancellations/skips.
  test:
    if: always()
    needs: platform-tests
    runs-on: ubuntu-latest
    steps:
      - run: test "$PLATFORM_RESULT" = success
        env:
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
