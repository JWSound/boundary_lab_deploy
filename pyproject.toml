[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundary-lab-deploy"
version = "0.1.0rc3"
description = "Standalone loudspeaker deployment and BEAT Engine solve service"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "beat-engine @ https://github.com/JWSound/BEAT_Engine/releases/download/v0.3.0/beat_engine-0.3.0-py3-none-any.whl#sha256=b1476287d893a208d14f6c5ef2292e7a831c78d903d72357a5a29a291016fdae",
  "numpy", "meshio",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15,<0.16", "build"]

[project.scripts]
boundary-deploy-worker = "boundary_deploy.worker:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/boundary_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
