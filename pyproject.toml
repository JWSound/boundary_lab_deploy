[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundary-lab-deploy"
version = "0.1.0rc4"
description = "Standalone loudspeaker deployment and BEAT Engine solve service"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "beat-engine @ https://github.com/JWSound/BEAT_Engine/releases/download/v0.5.1/beat_engine-0.5.1-py3-none-any.whl#sha256=ca429bb4f791051516836a0e8051e0cb60ce47b95b9627bc7a6c4b714f551669",
  "numpy", "meshio",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15,<0.16", "build"]

[project.scripts]
boundary-deploy-worker = "boundary_deploy.worker:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/boundary_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
